version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: zookeeper-estudos
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog

  kafka-1:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL_PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL_PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  redpanda-console:
    container_name: redpanda-console
    image: docker.redpanda.com/vectorized/console:latest
    depends_on:
      - kafka-1
    ports:
      - "8081:8080"           
    environment:
      KAFKA_BROKERS: kafka-1:29092
      #CONFIG_FILEPATH: /tmp/config.yml
      entrypoint: /bin/sh
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka-1:29092"] # Use the correct internal port

  postgres-eod-parallelism:
    container_name: postgres-eod-parallelism
    image: postgres:15.3
    environment:
      POSTGRES_DB: eod_parallelism_database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d eod_parallelism_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
  postgres_data: